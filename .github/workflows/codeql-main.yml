# CodeQL · main — trigger: push to main, plus a weekly schedule.
#
# ci.yml already runs CodeQL on every PR (fast feedback, blocks bad merges).
# But code-scanning alerts only populate the repo's Security tab from an
# analysis of the *default branch* — a PR-only trigger never lights that
# tab up. This workflow exists purely to satisfy that GitHub requirement;
# the actual PR-time gate stays in ci.yml so nothing else changes.
name: CodeQL · main

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1' # weekly, Monday 03:17 UTC — catches newly-disclosed CVEs even with no code changes

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Security tab)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-build-env

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:java-kotlin'
