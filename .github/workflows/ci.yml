# CI — trigger: pull_request into main.
#
# This is the quality gate every change must clear BEFORE it can be merged.
# Five independent jobs run in parallel (format, dependency-scan, sast,
# build-test, and image-scan which needs build-test). Nothing here creates a
# release or deploys anything — that only happens after merge, in
# release-and-deploy-dev.yml. See GUIDE.md for what to change live to show
# each of these failing, then passing.
name: CI

on:
  pull_request:
    branches: [main]

# A new push to the same PR cancels the previous, still-running CI for it —
# keeps the Actions tab readable and saves minutes during the demo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  format:
    name: 1 · Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-build-env
      - name: Spotless (google-java-format)
        run: mvn --batch-mode spotless:check

  dependency-scan:
    name: 2 · Dependency scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  sast:
    name: 3 · SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-build-env
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:java-kotlin'

  build-test:
    name: 4 · Build & unit tests
    uses: ./.github/workflows/reusable-build-test.yml

  image-scan:
    name: 5 · Build & scan container image
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (PR preview — not pushed anywhere)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: cicd-pipeline-demo:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cicd-pipeline-demo:pr-${{ github.event.pull_request.number }}
          scan-type: image
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
